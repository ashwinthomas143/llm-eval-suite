name: llm-eval-suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npx tsc --listEmittedFiles

      - run: ls -la dist/ dist/src/ dist/test/ 2>&1 || true

      - run: npm test
